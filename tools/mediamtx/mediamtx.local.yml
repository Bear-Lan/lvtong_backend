# 本仓库摄像头配置（主页实时视频 / 预约·可视对讲）
# 由 Flask（python main.py）自动拉起 tools/mediamtx/mediamtx.exe
# source 启动时按 devices.device_id 写入，勿手写死 IP

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554

rtmp: no
hls: no
srt: no

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
# 浏览器与 MediaMTX 不在同一台机器时，填本机局域网 IP，例如:
# webrtcAdditionalHosts: ["192.168.88.253"]
webrtcAdditionalHosts: []

pathDefaults:
  sourceOnDemand: yes
  sourceOnDemandStartTimeout: 15s
  sourceOnDemandCloseAfter: 30s

paths:
  # Pad 图像采集: /mtx/cam1/whep — 车尾枪机
  # source 由 Flask 从 devices.device_id=cam_lane（可用 LIVE_VIDEO_DEVICE_ID 覆盖）写入
  cam1:
    source: rtsp://admin:whds%402025@192.168.188.103:554/Streaming/Channels/101
    rtspTransport: tcp

  # Pad 主页面/图像采集: /mtx/cam2/whep — 独立车头相机
  # source 由 Flask 从 devices.device_id=cam_head 写入
  cam2:
    source: rtsp://admin:whds%402025@192.168.188.102:554/Streaming/Channels/101
    rtspTransport: tcp

  # Pad 左下「拍照」: /mtx/cam3/whep — 周界相机 A
  # source 由 Flask 从 devices.device_id=cam_safe 写入
  cam3:
    source: rtsp://admin:whds%402025@192.168.188.105:554/Streaming/Channels/101
    rtspTransport: tcp

  # 前端: /mtx/cam4/whep — 预约弹窗右侧画面
  # source 由 Flask 从 devices.device_id=cam_booking（可用 TALK_VIDEO_DEVICE_ID 覆盖）写入
  cam4:
    source: rtsp://admin:whds%402025@192.168.188.101:554/Streaming/Channels/101
    rtspTransport: tcp

  # Pad 前端: /mtx/cam5/whep — 球机纯浏览器预览
  # 独立于 Web 正在使用的 cam1/cam4；source 由 Flask 从 cam_ptz 写入
  cam5:
    source: rtsp://admin:whds%402025@192.168.188.104:554/Streaming/Channels/101
    rtspTransport: tcp

  # Pad 图像采集: /mtx/cam6/whep — 车顶相机
  # source 由 Flask 从 devices.device_id=cam_road（可用 ROAD_VIDEO_DEVICE_ID 覆盖）写入
  cam6:
    source: rtsp://admin:whds%402025@192.168.188.107:554/Streaming/Channels/101
    rtspTransport: tcp
